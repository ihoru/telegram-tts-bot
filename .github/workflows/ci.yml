name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Run Ruff lint
        run: uv run --locked ruff check .
      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .
      - name: Run strict mypy
        run: uv run --locked mypy src tests
      - name: Build package
        run: uv build

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Run test suite
        run: uv run --locked pytest

  container:
    name: Local-model and container integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for CUDA image
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Report available disk space
        run: df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build integration-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - name: Run real-model integration tests
        run: >-
          docker run --rm telegram-tts-bot:test
          /app/.venv/bin/pytest --no-cov
          -m "integration and not stress" -s
      - name: Build runtime image with pinned model
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Verify the exact runtime image
        run: ./scripts/verify-runtime-image.sh telegram-tts-bot:ci
