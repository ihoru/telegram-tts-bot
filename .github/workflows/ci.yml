name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Run Ruff lint
        run: uv run --locked ruff check .
      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .
      - name: Run strict mypy
        run: uv run --locked mypy src tests
      - name: Build package
        run: uv build

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true
          cache-python: true
          python-version: "3.14"
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Run test suite
        run: uv run --locked pytest

  container:
    name: CPU Silero and container integration
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report available disk space
        run: df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build integration-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test-cpu
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:test-cpu
          cache-from: type=gha,scope=test-cpu
          cache-to: type=gha,mode=max,scope=test-cpu
      - name: Run real-model integration tests
        run: >-
          docker run --rm telegram-tts-bot:test-cpu
          /app/.venv/bin/pytest --no-cov
          -m "integration and not stress" -s
      - name: Run constrained CPU two-render baseline
        run: >-
          docker run --rm --network none --cpus 2 --memory 1g --memory-swap 1g
          --entrypoint /usr/bin/time telegram-tts-bot:test-cpu
          -v /app/.venv/bin/pytest --no-cov
          tests/speech/test_real_model.py::test_two_shared_model_renders_complete_under_resource_limit -s
      - name: Build runtime image with pinned model
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-cpu
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:ci-cpu
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=runtime-cpu
          cache-to: type=gha,mode=max,scope=runtime-cpu
      - name: Verify the exact runtime image
        run: ./scripts/verify-runtime-image.sh telegram-tts-bot:ci-cpu cpu
      - name: Log in to GHCR for main deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified main image
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/ihoru/telegram-tts-bot:main-$COMMIT_SHA-cpu"
          docker tag telegram-tts-bot:ci-cpu "$image"
          docker push "$image"
          published=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          digest=${published##*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  container-gpu:
    name: GPU compatibility and container integration
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for CUDA image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Report available disk space
        run: df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build integration-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:test-gpu
          cache-from: type=gha,scope=test-gpu
          cache-to: type=gha,mode=max,scope=test-gpu
      - name: Run real-model integration tests
        run: >-
          docker run --rm telegram-tts-bot:test-gpu
          /app/.venv/bin/pytest --no-cov
          -m "integration and not stress" -s
      - name: Build runtime image with pinned model
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: telegram-tts-bot:ci-gpu
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=runtime-gpu
          cache-to: type=gha,mode=max,scope=runtime-gpu
      - name: Verify the exact runtime image
        run: ./scripts/verify-runtime-image.sh telegram-tts-bot:ci-gpu
      - name: Log in to GHCR for main deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified main image
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/ihoru/telegram-tts-bot:main-$COMMIT_SHA-gpu"
          docker tag telegram-tts-bot:ci-gpu "$image"
          docker push "$image"
          docker tag "$image" "ghcr.io/ihoru/telegram-tts-bot:main-$COMMIT_SHA"
          docker push "ghcr.io/ihoru/telegram-tts-bot:main-$COMMIT_SHA"
          published=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          digest=${published##*@}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy main to production
    needs: [container, container-gpu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    concurrency:
      group: telegram-tts-bot-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy the digest over restricted SSH
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ vars.DEPLOY_RUNTIME == 'gpu' && needs.container-gpu.outputs.digest || needs.container.outputs.digest }}
          DEPLOY_RUNTIME: ${{ vars.DEPLOY_RUNTIME || 'cpu' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_RUNTIME" in cpu|gpu) ;; *) echo "DEPLOY_RUNTIME must be cpu or gpu" >&2; exit 1 ;; esac
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current_sha" != "$COMMIT_SHA" ]]; then
            echo "Skipping superseded main commit."
            exit 0
          fi
          bash scripts/deploy_ssh.sh deploy

  verify-deployment-access:
    name: Verify restricted production SSH without deploying
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check restricted SSH access
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy_ssh.sh check
