[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "telegram-tts-bot"
version = "0.1.0"
description = "A local-first Telegram bot that turns mixed-language text into voice notes"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Igor Polyakov" }]
keywords = ["telegram", "text-to-speech", "qwen3-tts", "silero", "aiogram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.31.0,<4",
  "faster-qwen3-tts==0.4.0",
  "numpy==2.4.2",
  "python-dotenv>=1.2.1,<2",
  "torchaudio==2.11.0",
  "torch==2.13.0",
]

[project.scripts]
tts-to-ogg = "telegram_tts_bot.cli.tts_to_ogg:main"

[dependency-groups]
dev = [
  "mypy>=1.18.2,<3",
  "pre-commit>=4.3.0,<5",
  "pytest>=8.4.2,<10",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.13.2,<0.17",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torchaudio = { index = "pytorch-cu130" }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.build-backend]
source-include = [
  "AGENTS.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "assets/**",
  "licenses/**",
  "specs/**",
]
source-exclude = ["auditions/**"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
extend-exclude = [".models"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PIE",
  "PTH",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=telegram_tts_bot",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local system dependencies or real model assets",
  "stress: exercises constrained concurrent real-model rendering",
]
