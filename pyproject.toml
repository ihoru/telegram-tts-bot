[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "telegram-tts-bot"
version = "0.1.0"
description = "A local-first Telegram bot that turns text into Russian voice notes"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "Igor Polyakov" }]
keywords = ["telegram", "text-to-speech", "piper", "aiogram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiogram>=3.31.0,<4",
  "piper-tts>=1.7.0,<2",
]

[project.scripts]
tts-to-ogg = "telegram_tts_bot.cli.tts_to_ogg:main"

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pre-commit>=4.3.0,<5",
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.13.2,<0.14",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
extend-exclude = [".models"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PIE",
  "PTH",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=telegram_tts_bot",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local system dependencies or real model assets",
  "stress: exercises constrained concurrent real-model rendering",
]
