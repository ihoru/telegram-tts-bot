default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: strict mypy
        entry: uv run --locked mypy src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: fast pytest
        entry: uv run --locked pytest -m not\ integration\ and\ not\ stress
        language: system
        pass_filenames: false
        always_run: true
